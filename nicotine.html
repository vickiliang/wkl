<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nicotine Magazine — Vicki Liang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="gallery-body">

  <div class="grain-overlay"></div>

  <!-- Nav -->
  <nav class="index-nav">
    <span class="brand">Vicki Liang</span>
    <div class="nav-right">
      <a href="index.html" class="back-to-index">Index</a>
    </div>
  </nav>

  <!-- Project title bar -->
  <div class="gallery-project-bar">
    <span>Nicotine Magazine — Paris — (8) — Photography, Print editorial</span>
  </div>

  <!-- Gallery carousel -->
  <div class="gallery-carousel-wrapper">
    <div class="gallery-carousel" id="gallery-carousel">
      <div class="gallery-slide"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB65vqaf19U19oDb76F8PKfeTF_W0uuv8YMNk6GlWsRc2ia7-S2OxrjOPYyzWQ5yK5SrRx_QzYz6Li05lAjSFqhuuD_ViFLXVnyWFjO4UdWga3uz2pae0KXeKe1956LB5oTUZwBoWgQGt8w4QsngZ0QZb-B_5sLB-N3rZXXvxjjjbZnvY0RfMmLXAhGS5Yor5DZEf-flYuvkhMnX1CbXV5THQ6GfRfhkRcJ1Mf6iJFWxw8WH0JzmvFJtbA5ohCGz5Py6zpFtFF8msRx" alt="Nicotine 1"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=1200&q=80" alt="Nicotine 2"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1200&q=80" alt="Nicotine 3"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=1200&q=80" alt="Nicotine 4"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=1200&q=80" alt="Nicotine 5"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1495385794356-15371f348c31?w=1200&q=80" alt="Nicotine 6"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&q=80" alt="Nicotine 7"/></div>
      <div class="gallery-slide"><img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1200&q=80" alt="Nicotine 8"/></div>
    </div>
  </div>

  <!-- Footer counter -->
  <footer class="gallery-footer">
    <span class="counter-current" id="counter-current">1 / 8</span>
  </footer>

  <script>
    const carousel = document.getElementById('gallery-carousel');
    const slides = carousel.querySelectorAll('.gallery-slide');
    const total = slides.length;
    const counterEl = document.getElementById('counter-current');
    let tx = 0;
    let maxScroll = 0;

    function centerFirstSlide() {
      const firstSlide = slides[0];
      if (!firstSlide) return;
      const vw = carousel.parentElement.clientWidth;
      const slideW = firstSlide.offsetWidth;
      const pad = (vw - slideW) / 2;
      carousel.style.paddingLeft = Math.max(0, pad) + 'px';
    }

    function init() {
      centerFirstSlide();
      maxScroll = carousel.scrollWidth - carousel.parentElement.clientWidth;
    }

    window.addEventListener('load', init);
    window.addEventListener('resize', init);

    function updateCounter() {
      if (maxScroll > 0) {
        const cur = Math.min(total, Math.max(1, Math.round((tx / maxScroll) * (total - 1)) + 1));
        counterEl.textContent = cur + ' / ' + total;
      }
    }

    // Wheel event drives horizontal scroll only
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY || e.deltaX;
      tx = Math.max(0, Math.min(tx + delta, maxScroll));
      carousel.style.transform = 'translateX(' + (-tx) + 'px)';
      updateCounter();
    }, { passive: false });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        tx = Math.min(tx + 300, maxScroll);
        carousel.style.transform = 'translateX(' + (-tx) + 'px)';
        updateCounter();
      }
      if (e.key === 'ArrowLeft') {
        tx = Math.max(tx - 300, 0);
        carousel.style.transform = 'translateX(' + (-tx) + 'px)';
        updateCounter();
      }
      if (e.key === 'Escape') { fadeOut('index.html'); }
    });

    // Fade-out transition for back to index
    function fadeOut(href) {
      document.body.classList.add('gallery-fade-out');
      setTimeout(() => { window.location.href = href; }, 500);
    }

    document.querySelector('.back-to-index').addEventListener('click', function(e) {
      e.preventDefault();
      fadeOut(this.getAttribute('href'));
    });
  </script>

</body>
</html>
