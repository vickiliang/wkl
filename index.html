<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vicki Liang | Studio Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="grain-overlay"></div>

  <!-- Main -->
  <main class="index-main">
    <div class="portfolio-list">
      <div class="portfolio-rows-wrapper">

      <!-- Project rows injected from Contentful -->

      </div><!-- /.portfolio-rows-wrapper -->

      <div class="portfolio-row portfolio-identity">
        <span class="col-title">Vicki Liang</span>
        <span class="col-tags identity-links">
          <span class="identity-info">Info</span>
          <a href="mailto:info@vickiliang.com">info@vickiliang.com</a>
          <a href="https://www.instagram.com/vickiliang_/" target="_blank">@vickiliang_</a>
        </span>
      </div>

    </div>
  </main>

  <script>
    // ── Contentful config ──
    const CF_SPACE = 'kdqwlvpzgxdf';
    const CF_TOKEN = 'vbdG7-M4khS5KODqrV5_loqG7IsaHw-TVv9adYOj6jk';

    // ── Gallery drawer state ──
    let activeRow = null;
    let activeDrawer = null;
    let autoCloseTimer = null;

    function closeDrawer(instant) {
      if (!activeDrawer) return;
      clearTimeout(autoCloseTimer);
      autoCloseTimer = null;
      const drawer = activeDrawer;
      const row = activeRow;
      if (instant) { drawer.remove(); }
      else { drawer.classList.remove('open'); setTimeout(() => drawer.remove(), 380); }
      row.classList.remove('active');
      activeRow = null; activeDrawer = null;
    }

    function openDrawer(row, images) {
      const drawer = document.createElement('div');
      drawer.className = 'gallery-drawer';
      const track = document.createElement('div');
      track.className = 'gallery-drawer-track';
      images.forEach(src => {
        const img = document.createElement('img');
        img.src = src; img.draggable = false;
        track.appendChild(img);
      });
      drawer.appendChild(track);
      const wrapper = document.querySelector('.portfolio-rows-wrapper');
      drawer.style.order = (parseInt(row.style.order) + 1).toString();
      wrapper.appendChild(drawer);
      let isDragging = false, startX = 0, scrollStart = 0;
      track.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; scrollStart = track.scrollLeft; track.style.cursor = 'grabbing'; });
      window.addEventListener('mousemove', e => { if (!isDragging) return; track.scrollLeft = scrollStart - (e.clientX - startX); });
      window.addEventListener('mouseup', () => { isDragging = false; track.style.cursor = ''; });
      track.addEventListener('wheel', e => { e.preventDefault(); track.scrollLeft += e.deltaY + e.deltaX; }, { passive: false });
      requestAnimationFrame(() => requestAnimationFrame(() => drawer.classList.add('open')));
      row.classList.add('active');
      activeRow = row; activeDrawer = drawer;
      autoCloseTimer = setTimeout(() => closeDrawer(false), 3000);
    }

    // ── Hover preview element (created once) ──
    const hoverPreview = document.createElement('div');
    hoverPreview.className = 'hover-preview';
    const hoverImg = document.createElement('img');
    hoverImg.draggable = false;
    hoverPreview.appendChild(hoverImg);
    document.body.appendChild(hoverPreview);

    // ── Attach handlers to all project rows ──
    function initRowHandlers() {
      const projectRows = document.querySelectorAll('.portfolio-rows-wrapper .portfolio-row');

      // Normalise all rows to the widest row so titles stay left-aligned
      let maxW = 0;
      projectRows.forEach(r => { maxW = Math.max(maxW, r.scrollWidth); });
      projectRows.forEach((r, i) => {
        r.style.minWidth = maxW + 'px';
        r.style.order    = (i * 2).toString(); // even slots; drawer gets odd slot
        r.style.animationDelay = (i * 0.04) + 's';
      });

      projectRows.forEach(row => {
        row.addEventListener('mouseenter', function() {
          if (activeRow === this) return;
          const preview = this.dataset.preview;
          if (!preview) return;
          hoverImg.src = preview;
          hoverPreview.classList.add('visible');
          // Preload full-res gallery images while user hovers
          const raw = this.dataset.images;
          if (raw) JSON.parse(raw).forEach(src => { const i = new Image(); i.src = src; });
        });
        row.addEventListener('mouseleave', function() {
          hoverPreview.classList.remove('visible');
        });
        row.addEventListener('click', function(e) {
          e.preventDefault();
          const raw = this.dataset.images;
          if (!raw) return;
          const images = JSON.parse(raw);
          hoverPreview.classList.remove('visible');
          if (activeRow === this) { closeDrawer(false); return; }
          closeDrawer(true);
          openDrawer(this, images);
        });
      });
    }

    // ── Load projects from Contentful ──
    async function loadFromContentful() {
      try {
        const res = await fetch(
          `https://cdn.contentful.com/spaces/${CF_SPACE}/entries?content_type=project&include=1&order=sys.createdAt&access_token=${CF_TOKEN}`
        );
        const data = await res.json();

        // Build asset URL lookup
        const assetMap = {};     // full-res for gallery drawer
        const assetMapThumb = {}; // smaller for hover preview
        (data.includes?.Asset || []).forEach(a => {
          const base = 'https:' + a.fields.file.url;
          assetMap[a.sys.id]      = base + '?w=1400&q=80&fm=webp';
          assetMapThumb[a.sys.id] = base + '?w=1400&q=85&fm=webp';
        });

        // Insert rows into the wrapper
        const wrapper = document.querySelector('.portfolio-rows-wrapper');

        data.items.forEach(item => {
          const { projectName, projectGenre, year, assets } = item.fields;
          const refs = Array.isArray(assets) ? assets : assets ? [assets] : [];
          const imgs      = refs.map(a => assetMap[a.sys.id]).filter(Boolean);
          const thumbImgs = refs.map(a => assetMapThumb[a.sys.id]).filter(Boolean);

          const row = document.createElement('a');
          row.href = '#';
          row.className = 'portfolio-row';
          if (imgs.length) {
            row.dataset.images  = JSON.stringify(imgs);
            row.dataset.preview = thumbImgs[0] || imgs[0];
          }
          row.innerHTML = `
            <span class="col-title">${projectName || ''}</span>
            <span class="col-year">${year || ''}</span>
            <span class="col-city"></span>
            <span class="col-count">(${imgs.length})</span>
            <span class="col-tags">${projectGenre || ''}</span>
          `;
          wrapper.appendChild(row);
        });

        initRowHandlers();

        // Silently preload all hover preview thumbnails
        document.querySelectorAll('.portfolio-row[data-preview]').forEach(row => {
          const img = new Image();
          img.src = row.dataset.preview;
        });
      } catch (err) {
        console.error('Contentful fetch failed:', err);
      }
    }

    loadFromContentful();

    // ── Info slide-up panel ──
    const infoPanel = document.createElement('div');
    infoPanel.className = 'info-panel';
    const infoPanelInner = document.createElement('div');
    infoPanelInner.className = 'info-panel-inner';
    infoPanel.appendChild(infoPanelInner);
    document.body.appendChild(infoPanel);

    const identityRow = document.querySelector('.portfolio-identity');
    infoPanel.style.top = identityRow.getBoundingClientRect().bottom + 'px';

    let infoPanelLoaded = false;

    function openInfoPanel()  { infoPanel.classList.add('open');    }
    function closeInfoPanel() { infoPanel.classList.remove('open'); }

    function ensureLoaded(cb) {
      if (infoPanelLoaded) { cb(); return; }
      fetch('info.html').then(r => r.text()).then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const grid = doc.querySelector('.editorial-grid');
        if (grid) infoPanelInner.appendChild(grid);
        infoPanelLoaded = true;
        cb();
      });
    }

    identityRow.addEventListener('mouseenter', function() {
      ensureLoaded(() => openInfoPanel());
    });
    identityRow.addEventListener('mouseleave', function() {
      closeInfoPanel();
    });
  </script>

</body>
</html>
